name: Composite Action Demo

on:
  workflow_dispatch:

jobs:
  greet:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Composite Action
        id: greet

        uses: ./.github/actions/setup-and-greet

        with:
          name: Jeeni
          language: en

      - name: Show Output
        run: |
          echo "Greeting completed: ${{ steps.greet.outputs.greeted }}"
